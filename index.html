<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0d33">
<title>みならい魔女のマジカルロード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0d33;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:#fff;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;touch-action:none;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--gold:#ffd34d;--pink:#ff7ab0;--vio:#7a4ad0}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.htop{position:absolute;top:calc(var(--st) + 8px);left:10px;right:10px;display:flex;align-items:center;gap:7px}
.chip{font-weight:900;font-size:13px;background:rgba(40,16,80,.82);border:2px solid rgba(200,160,255,.6);padding:4px 10px;border-radius:14px;white-space:nowrap}
.hprog{flex:1;height:9px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.5)}
#hProg{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .15s}
.hbtn{pointer-events:auto;height:34px;padding:0 10px;border-radius:14px;background:rgba(40,16,80,.85);color:#fff;font-weight:900;font-size:14px;border:2px solid rgba(200,160,255,.7)}
.hbot{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 10px);display:flex;flex-direction:column;gap:6px}
.hprow{display:flex;align-items:center;gap:6px}
.hpw{flex:1;max-width:260px;height:16px;background:rgba(0,0,0,.45);border:2px solid #fff;border-radius:10px;overflow:hidden;position:relative}
#hpFill{height:100%;background:linear-gradient(90deg,#ff5a8a,#7dff8a);transition:width .25s}
#hpNum{position:absolute;inset:0;font-size:11px;font-weight:900;line-height:12px;text-align:center;text-shadow:0 1px 2px #000}
.hpi{font-size:16px}
.hrow2{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
#spells,#pets{display:flex;gap:3px;flex-wrap:wrap}#buffs{display:flex;gap:4px;margin-right:auto}.bf{font-weight:900;font-size:13px;padding:3px 7px;border-radius:10px;background:rgba(30,12,60,.85);border:2px solid #ff9ae8;animation:bp .6s infinite}.bf.b2{border-color:#9ae8ff;animation:none}#pets{justify-content:flex-end}
.sp{display:flex;flex-direction:column;align-items:center;background:rgba(30,12,60,.8);border:2px solid var(--c);border-radius:10px;padding:1px 4px;font-size:15px;line-height:1.1}
.sp i{font-style:normal;font-size:7px;color:var(--c);letter-spacing:-1px}
.sp b{font-size:10px;color:#fff;line-height:1}
.sp.pop{animation:spp .7s cubic-bezier(.3,1.8,.5,1)}.sp.drop{animation:spd .5s}
@keyframes spp{0%{transform:scale(1)}40%{transform:scale(1.6);box-shadow:0 0 18px var(--c)}100%{transform:scale(1)}}
@keyframes spd{0%,100%{transform:none}30%{transform:translateY(6px);filter:grayscale(1)}}
#lvup{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:8;pointer-events:none;min-width:240px;text-align:center;padding:12px 20px 14px;border-radius:22px;background:linear-gradient(180deg,rgba(40,16,80,.95),rgba(20,8,44,.95));border:4px solid var(--c);box-shadow:0 0 30px var(--c);transition:transform .35s cubic-bezier(.3,1.7,.5,1),opacity .25s}
#lvup.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#lvup.down{filter:saturate(.3);box-shadow:none}
#lvup .li{font-size:36px;line-height:1.1}
#lvup .lt{font-weight:900;font-size:15px;color:#e8dcff}
#lvup .ll{font-weight:900;font-size:22px;margin-top:2px}#lvup .ll b{font-size:28px;color:var(--c);text-shadow:0 0 12px var(--c)}#lvup .ll span{color:#fff;font-size:16px}
#lvup .lp{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
#lvup .lp i{width:22px;height:12px;border-radius:6px;background:rgba(255,255,255,.18)}
#lvup .lp i.on{background:var(--c)}#lvup .lp i.nw{animation:nw .5s .25s cubic-bezier(.3,1.8,.5,1) both}
@keyframes nw{from{transform:scale(0)}}
#lvup .lx{font-weight:800;font-size:13px;color:#fff6c0}
.pt{display:flex;flex-direction:column;align-items:center;background:rgba(30,12,60,.8);border:2px solid #aaa;border-radius:10px;padding:1px 3px;font-size:15px;line-height:1.1}
.pt i{font-style:normal;font-size:8px;color:var(--gold)}
.pt.t2{border-color:#7fd0ff;box-shadow:0 0 8px #7fd0ff}.pt.t3{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
/* もんだい */
#qb{position:fixed;top:calc(var(--st) + 50px);left:50%;transform:translateX(-50%);width:min(95vw,640px);background:linear-gradient(180deg,rgba(255,250,240,.97),rgba(255,236,250,.97));color:#3a1a5a;border:3px solid var(--pink);border-radius:18px;padding:7px 10px 8px;z-index:6;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:qin .25s ease-out}
#qb.boss{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,211,77,.4),0 8px 24px rgba(0,0,0,.35)}
@keyframes qin{from{transform:translateX(-50%) scale(.85);opacity:0}}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:3px}
#qTag{font-size:11px;font-weight:900;color:#fff;padding:2px 8px;border-radius:8px}
.qboss{font-size:11px;font-weight:900;background:var(--gold);color:#5a3a00;padding:2px 8px;border-radius:8px;display:none}
#qb.boss .qboss{display:inline}
#qText{font-size:clamp(15px,4.1vw,20px);font-weight:800;line-height:1.4}
#ans{position:fixed;left:0;right:0;z-index:6;pointer-events:none}
#ansRow{position:relative;height:var(--ah,64px)}
.ac{position:absolute;bottom:0;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(13px,3.8vw,18px);padding:6px 4px;border-radius:14px;background:rgba(255,250,255,.5);border:3px solid #d8c0ff;color:#2a0a4a;text-shadow:0 0 4px #fff,0 0 2px #fff;line-height:1.25;word-break:break-all;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .12s,background .12s}
.ac[data-l="0"]{border-color:#ff7ab0}.ac[data-l="1"]{border-color:#ffc94d}.ac[data-l="2"]{border-color:#7fd0ff}
.ac.on{background:rgba(255,211,77,.68);color:#3a2600;border-color:#fff;transform:scale(1.07);box-shadow:0 0 16px rgba(255,211,77,.9)}
#ansBarW{position:absolute;bottom:-10px;margin:0;background:rgba(0,0,0,.35)}
.ch{flex:1;text-align:center;font-weight:900;font-size:clamp(13px,3.8vw,18px);padding:7px 3px;border-radius:12px;background:#f3e8ff;border:2px solid #d8c0ff;color:#3a1a5a;line-height:1.25;transition:all .12s;word-break:break-all}
.ch[data-l="0"]{border-color:#ff7ab0}.ch[data-l="1"]{border-color:#ffc94d}.ch[data-l="2"]{border-color:#7fd0ff}
.ch.on{background:var(--gold);color:#3a2600;border-color:#fff;transform:scale(1.05);box-shadow:0 0 12px rgba(255,211,77,.8)}
.qbar{height:5px;background:rgba(0,0,0,.08);border-radius:4px;margin-top:6px;overflow:hidden}
#ansBar{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffd34d,#7dff8a);width:100%}
#toast{position:fixed;top:calc(var(--st) + 50px);left:50%;transform:translateX(-50%);width:min(92vw,560px);padding:10px 14px;border-radius:16px;z-index:7;font-size:14px;line-height:1.5;font-weight:800;pointer-events:none;animation:qin .2s;background:rgba(40,16,80,.94);border:3px solid #c9a8ff}
#toast b{font-size:16px;color:#ffe066}
/* ボス */
#bossUI{position:fixed;top:calc(var(--st) + 46px);left:50%;transform:translateX(-50%);width:min(80vw,460px);z-index:5;pointer-events:none;text-align:center}
#qb:not(.hidden) ~ #bossUI{top:auto;bottom:calc(var(--sb) + 104px)}
#bName{font-weight:900;font-size:14px;text-shadow:0 2px 0 #000;margin-bottom:2px}
.bhp{height:14px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:9px;overflow:hidden}
#bHP{height:100%;background:linear-gradient(90deg,#c02a8a,#ff7a3a);transition:width .3s ease-out;width:100%}
/* たからばこ */
#chest{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,8,40,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
.ct{font-weight:900;font-size:clamp(20px,6vw,28px);color:var(--gold);text-shadow:0 3px 0 #7a4a10;margin-bottom:14px;text-align:center}
.cards{display:flex;gap:10px;width:min(100%,600px)}
.cd{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px 14px;border-radius:20px;background:linear-gradient(180deg,#fff8ff,#f0e0ff);color:#3a1a5a;border:3px solid var(--gold);box-shadow:0 6px 0 #a07a20,0 10px 20px rgba(0,0,0,.4);animation:cdin .45s cubic-bezier(.3,1.6,.5,1) both}
.cd:nth-child(2){animation-delay:.08s}.cd:nth-child(3){animation-delay:.16s}
@keyframes cdin{from{transform:translateY(40px) scale(.6);opacity:0}}
.cd:active{transform:translateY(4px);box-shadow:0 2px 0 #a07a20}
.ctag{white-space:nowrap;font-size:9px;font-weight:900;background:var(--vio);color:#fff;border-radius:8px;padding:1px 7px}
.cic{font-size:40px;line-height:1.1}
.cd b{font-size:clamp(13px,3.7vw,17px);line-height:1.25}
.cd small{font-size:11px;font-weight:700;color:#6a4a8a;line-height:1.35}
/* がめん */
#scr{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 14px) 14px calc(var(--sb) + 14px);overflow:auto}
#scr.show{display:flex}
#scr.map,#scr.result,#scr.review,#scr.intro,#scr.over,#scr.settings,#scr.pause{background:rgba(26,10,52,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#scr.map,#scr.review,#scr.settings,#scr.intro,#scr.result{align-items:flex-start}
.ttl{text-align:center;margin-top:-4vh}
.logo{display:flex;flex-direction:column;align-items:center;animation:float 2.6s ease-in-out infinite;margin-bottom:24px}
@keyframes float{50%{transform:translateY(-8px)}}
.l0{font-weight:900;font-size:clamp(22px,7vw,40px);color:#fff;text-shadow:0 3px 0 #7a4ad0,0 0 14px rgba(255,150,230,.7)}
.l1{font-weight:900;font-size:clamp(42px,13vw,86px);line-height:1.05;background:linear-gradient(180deg,#fff6c0,#ffd34d 45%,#ff7ab0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2a9a) drop-shadow(0 0 16px rgba(255,180,255,.6))}
.big{display:block;margin:10px auto 0;padding:14px 34px;border-radius:30px;background:linear-gradient(180deg,#ffb0dc,#ff6aa8);color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 #a0306a,0 8px 18px rgba(0,0,0,.35);min-width:220px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #a0306a}
.big.warn{background:linear-gradient(180deg,#ffe08a,#ffb020);color:#5a3a00;box-shadow:0 5px 0 #a07010;text-shadow:none}
.pulse{animation:bp 1s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.06)}}
.sm{width:42px;height:38px;border-radius:12px;background:rgba(40,16,80,.9);color:#fff;font-size:18px;font-weight:900;border:2px solid #c9a8ff}
.sm2{display:block;margin:10px auto 0;padding:10px 22px;border-radius:20px;background:rgba(255,255,255,.1);color:#fff;font-weight:900;font-size:15px;border:2px solid #c9a8ff;min-width:200px}
.sm2.danger{border-color:#ff6a6a;color:#ffb0b0}
.map{width:min(100%,600px);margin:0 auto}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mt{font-weight:900;font-size:24px;text-shadow:0 2px 0 #5a2a9a}
.wc{background:linear-gradient(180deg,rgba(60,30,110,.95),rgba(36,16,70,.95));border-radius:20px;padding:10px 10px 12px;margin:10px 0;border:3px solid var(--wc);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.wc.lock{filter:grayscale(.8);opacity:.75}
.wch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wci{width:46px;height:46px;border-radius:14px;background:var(--wc);font-size:28px;display:flex;align-items:center;justify-content:center;flex:none}
.wcn{font-weight:900;font-size:21px}.wcp{font-size:12px;font-weight:800;color:#e0c8ff}
.sns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sn{background:rgba(255,255,255,.08);border:2px solid var(--wc);color:#fff;border-radius:14px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;min-height:84px}
.sn b{font-size:20px;line-height:1}.sn small{font-size:9.5px;font-weight:800;line-height:1.2;color:#f0e0ff;flex:1;display:flex;align-items:center}
.sn em{font-style:normal;font-size:11px;color:var(--gold);letter-spacing:-1px}
.sn:active{transform:translateY(3px)}
.wc.tower .big{margin-top:6px}
.card{width:min(100%,520px);margin:0 auto;background:linear-gradient(180deg,#3c1e70,#22104a);border:3px solid var(--wc,#c9a8ff);border-radius:26px;padding:18px 16px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:cin .3s ease-out}
@keyframes cin{from{transform:scale(.85);opacity:0}}
.in{font-weight:900;color:var(--gold);font-size:13px;letter-spacing:1px}
.it{font-weight:900;font-size:28px;line-height:1.2}.it small{display:block;font-size:15px;color:#e0c8ff}
#introBoss{width:240px;height:188px;display:block;margin:4px auto 0}
.ib{font-weight:800;font-size:16px}
.carry{margin:8px 0 2px;font-weight:800;font-size:13px;line-height:1.6;background:rgba(255,211,77,.12);border:2px dashed var(--gold);border-radius:12px;padding:6px 8px}

.over .rt.red{color:#ff8aa8;text-shadow:0 4px 0 #6a1030}
.stars{font-size:54px;letter-spacing:6px;margin:4px 0}
.st{color:#4a3a6a;display:inline-block}.st.on{color:var(--gold);animation:spop .5s cubic-bezier(.3,1.8,.5,1) both;text-shadow:0 0 16px #ffb300}
@keyframes spop{from{transform:scale(0) rotate(-90deg)}}
.rows{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 12px;margin:8px 0}
.rows div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}
.rows div:last-child{border:0}.rows b{font-size:17px;text-align:right}
.orz{font-weight:800;font-size:16px;margin:8px 0;line-height:1.5}
.rvl{text-align:left;max-height:60vh;overflow:auto}
.rvi{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--pink)}
.rq{font-weight:800;font-size:15px;line-height:1.45}
.ra{color:#7dff8a;font-weight:900;font-size:17px;margin-top:4px}
.re{font-size:13px;color:#e8dcff;margin-top:4px;line-height:1.5;font-weight:700}
.set textarea{width:100%;height:64px;border-radius:10px;border:0;padding:8px;font-size:11px;margin-top:4px;font-family:monospace;-webkit-user-select:text;user-select:text}
.sh{font-weight:900;margin-top:14px;text-align:left}.ss{font-size:13px;color:#7dff8a;text-align:center;font-weight:800;margin-top:6px}
.how{font-size:13px;line-height:1.7;text-align:left;background:rgba(255,211,77,.1);border:2px dashed var(--gold);border-radius:12px;padding:8px 10px;font-weight:800;margin:8px 0}
.tnote{margin-top:14px;font-size:13px;font-weight:800;line-height:1.6;background:rgba(40,16,80,.8);border-radius:14px;padding:8px 12px;display:inline-block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div class="htop"><div class="chip" id="hStage"></div><div class="hprog"><div id="hProg"></div></div><button class="hbtn" id="btnSpd">▶ ×1</button><button class="hbtn" id="btnPause">❚❚</button></div>
  <div class="hbot">

</div>
<div id="ans" class="hidden"><div id="ansRow"></div><div class="qbar" id="ansBarW"><div id="ansBar"></div></div></div>

<div id="chest" class="hidden"></div>
<div id="lvup"></div>
<div id="scr"></div>

    const to = towerOpen();
    scr.innerHTML = `<div class="map"><div class="mh"><button class="sm" data-act="toTitle">◀</button><div class="mt">どこへ いく？</div><button class="sm" data-act="settings">⚙</button></div>${cards}
      <div class="wc tower ${to ? '' : 'lock'}" style="--wc:#c060ff"><div class="wch"><span class="wci">🗼</span><div><div class="wcn">ミックスの とう</div><div class="wcp">${to ? `ぜんぶの教科が まざる。どこまで のぼれるかな？（さいこう ${save.tower || 0}かい）` : '🔒 5つのワールドの ステージ5を クリアすると ひらくよ'}</div></div></div>${to ? '<button class="big" data-act="tower">のぼる！</button>' : ''}</div></div>`;
  } else if (name === 'intro') {
    const [wk, si] = G.intro, w = WORLDS.find(x => x.key === wk), B = BOSSES[wk][si];
    scr.innerHTML = `<div class="card intro" style="--wc:${w.color}"><div class="in">${w.icon} ${w.name}・${w.place}</div><div class="it">ステージ${si + 1}<small>${w.stages[si]}</small></div>
      <canvas id="introBoss" width="320" height="250"></canvas><div class="ib">ボス：<b>${B[0]}</b></div>
      ${G.carry ? `<div class="carry">まえの ステージの つよさで しゅっぱつ！<br>${Object.keys(G.carry.spells).map(k => SPELLS[k].icon + 'Lv' + G.carry.spells[k]).join(' ')}　${G.carry.pets.map(p => PETS[p.type].icon + '★'.repeat(p.tier)).join('')}　💖${G.carry.hpMax}</div>` : ''}
      <button class="big pulse" data-act="go">しゅっぱつ！</button><button class="sm2" data-act="toMap">もどる</button></div>`;
    const c = $('#introBoss').getContext('2d'); let tt = 0; const b = { type: B[1], c1: B[2], c2: B[3] };
    const anim = () => { if (scr.className.indexOf('intro') < 0 || !$('#introBoss')) return; tt += 1 / 60; c.clearRect(0, 0, 320, 250); drawBossAt(c, b, 160, 238, 18, tt, false); requestAnimationFrame(anim); }; anim();
  } else if (name === 'pause') {
    scr.innerHTML = `<div class="card"><div class="it">ひとやすみ</div><button class="big" data-act="resume">つづける</button><button class="sm2" data-act="retry">さいしょから</button><button class="sm2" data-act="toMap">マップへ</button><button class="sm2" data-act="snd">${save.sound ? '🔊 おと：オン' : '🔇 おと：オフ'}</button></div>`;
  } else if (name === 'over') {
    const r = G.run;
    scr.innerHTML = `<div class="card over"><div class="rt red">やられちゃった…</div>${r.mode === 'tower' ? `<div class="orz">🗼 ${r.floor}かい まで のぼった！（さいこう ${save.tower}かい）</div>` : ''}
      <div class="rows"><div><span>せいかい</span><b>${r.stats.correct} / ${r.stats.total}</b></div></div>
      ${r.cp ? '<button class="big pulse" data-act="fromCp">チェックポイントから</button>' : ''}
      ${r.wrongs.length ? '<button class="sm2" data-act="review">まちがえた問題を見る</button>' : ''}
      <button class="sm2" data-act="retry">さいしょから</button><button class="sm2" data-act="toMap">マップへ</button></div>`;
  } else if (name === 'result') {
    const R = G.lastResult, r = R.r;
    scr.innerHTML = `<div class="card res"><div class="rt">ステージ クリア！</div><div class="stars">${[0, 1, 2].map(i => `<span class="st ${i < R.stars ? 'on' : ''}" style="animation-delay:${.2 + i * .25}s">★</span>`).join('')}</div>
      <div class="rows"><div><span>せいかい</span><b>${r.stats.correct} / ${r.stats.total}</b></div><div><span>のこりの たいりょく</span><b>${Math.max(0, Math.ceil(r.hp))}</b></div>
      <div><span>まほう</span><b>${Object.keys(r.spells).map(k => SPELLS[k].icon + r.spells[k]).join(' ')}</b></div><div><span>つかいま</span><b>${r.pets.map(p => PETS[p.type].icon + '★'.repeat(p.tier)).join(' ') || 'なし'}</b></div></div>
      ${!R.reviewed ? '<button class="big pulse warn" data-act="review">まちがえた問題を見なおす</button>' : `${r.si < 4 ? '<button class="big pulse" data-act="next">つぎの ステージへ ▶</button>' : ''}<button class="sm2" data-act="retry">もういちど</button><button class="sm2" data-act="toMap">マップへ</button>`}</div>`;
  } else if (name === 'review') {
    const list = G.run.wrongs;
    scr.innerHTML = `<div class="card rev"><div class="it">見なおし</div><div class="rvl">${list.map(q => `<div class="rvi"><div class="rq">${q.q}</div><div class="ra">◎ ${q.a}</div><div class="re">${q.exp || ''}</div></div>`).join('')}</div><button class="big" data-act="reviewDone">わかった！</button></div>`;
  } else if (name === 'settings') {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
    scr.innerHTML = `<div class="card set"><div class="it">せってい</div><button class="sm2" data-act="snd">${save.sound ? '🔊 おと：オン' : '🔇 おと：オフ'}</button>
      <div class="sh">きろくの かきだし</div><textarea id="exp" readonly>${data}</textarea><button class="sm2" data-act="copy">コピー</button>
      <div class="sh">きろくの よみこみ</div><textarea id="imp" placeholder="ここに はりつけ"></textarea><button class="sm2" data-act="import">よみこむ</button>
      <div id="setMsg" class="ss"></div><button class="sm2 danger" data-act="reset">きろくを ぜんぶ けす</button><button class="big" data-act="toMap">もどる</button></div>`;
  }
}
function hideScreen() { scr.className = ''; scr.innerHTML = ''; }
function hideUI() { $('#lvup').classList.remove('show'); ['#hud', '#qb', '#ans', '#bossUI', '#chest', '#toast'].forEach(s => $(s).classList.add('hidden')); }
let resetArm = false;
const ACT = {
  toTitle() { G.run = makeDemo(); hideUI(); showScreen('title'); },
  toMap() { audioInit(); setTimeout(() => { makeBGM('run'); setTimeout(() => makeBGM('boss'), 400); }, 300); bgmMode('calm'); G.paused = false; G.timers = []; G.run = makeDemo(); hideUI(); showScreen('map'); },
  intro(arg) { const [wk, si] = arg.split(':'); G.intro = [wk, +si]; G.carry = null; showScreen('intro'); },
  go() { const w = WORLDS.find(x => x.key === G.intro[0]); startRun(w, G.intro[1], 'stage', G.carry); },
  tower() { startRun(TOWER, 0, 'tower'); },
  resume() { G.paused = false; hideScreen(); },
  retry() { const r = G.run; G.paused = false; if (r.mode === 'tower') startRun(TOWER, 0, 'tower'); else startRun(r.W, r.si, 'stage', r.carry); },
  fromCp() { const r = G.run; restore(r); G.parts = []; G.floats = []; G.fx = []; G.timers = []; hideScreen(); $('#hud').classList.remove('hidden'); updHud(r); bgmMode('run'); bigText('チェックポイント', '#fff', 'もういちど がんばろう！'); },
  next() { const r = G.lastResult.r; G.intro = [r.wk, r.si + 1]; G.carry = carryOf(r); showScreen('intro'); },
  review() { showScreen('review'); },
  reviewDone() { if (G.lastResult && G.lastResult.r === G.run && G.run.phase === 'clear') { G.lastResult.reviewed = true; showScreen('result'); } else showScreen('over'); },
  snd(_, b) { save.sound = !save.sound; persist(); if (AU.master) AU.master.gain.value = save.sound ? .55 : 0; playBGM(); b.textContent = save.sound ? '🔊 おと：オン' : '🔇 おと：オフ'; },
  settings() { showScreen('settings'); },
  copy() { const t = $('#exp'); t.select(); const done = () => $('#setMsg').textContent = 'コピーしました'; try { navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand('copy'); done(); }); } catch (e) { document.execCommand('copy'); done(); } },
  import() { try { const s = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!s || s.v !== 1) throw 0; save = Object.assign(defSave(), s); persist(); $('#setMsg').textContent = 'よみこみました'; } catch (e) { $('#setMsg').textContent = 'よみこめませんでした'; } },
  reset(_, b) { if (!resetArm) { resetArm = true; b.textContent = 'もういちど おすと きえます'; return; } resetArm = false; save = defSave(); persist(); showScreen('settings'); $('#setMsg').textContent = 'けしました'; }
};
scr.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; SFX.click(); ACT[b.dataset.act](b.dataset.arg, b); });
function carryOf(r) { return { spells: { ...r.spells }, pets: r.pets.map(p => ({ type: p.type, tier: p.tier })), hpMax: r.hpMax }; }
function startRun(Wd, si, mode, carry) {
  audioInit(); hideScreen(); hideUI(); G.paused = false; G.timers = []; G.parts = []; G.floats = []; G.fx = []; poolNext.used.clear();
  G.run = buildRun(Wd, si, mode); const r0 = G.run; r0.carry = carry || null;
  if (carry) { r0.spells = { ...carry.spells }; r0.pets = carry.pets.map(p => ({ ...p, cd: rnd(0, 1), x: 0, y: 2, z: 0, dash: 0 })); r0.hpMax = carry.hpMax; r0.hp = carry.hpMax; }
  $('#hud').classList.remove('hidden'); updHud(G.run); bgmMode('run');
  bigText(mode === 'tower' ? 'ミックスの とう' : `ステージ ${si + 1}`, '#fff', mode === 'tower' ? 'どこまで のぼれるかな？' : Wd.stages[si]);
}
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }
G.run = makeDemo(); showScreen('title'); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { const r = G.run; if (document.hidden && r && !r.demo && r.phase === 'run' && !G.paused) { G.paused = true; showScreen('pause'); } });

</script>
